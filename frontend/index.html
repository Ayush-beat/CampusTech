<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('campustech_theme');
          var isDark = saved === 'dark' || (!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusTech — Student Financial Intelligence</title>
    <meta name="description" content="CampusTech — Student Financial Intelligence. Your money, your semester, your perspective. Intelligent student expense analytics and budgeting platform." />
    <meta name="theme-color" content="#163D32" />
  </head>

</html>
