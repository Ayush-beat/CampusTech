
[project]
name = "campustech-api"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "pymysql>=1.1.0"
]

[tool.vercel]
entrypoint = "app.main:app"
